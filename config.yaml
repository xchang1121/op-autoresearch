# framework reference tables and adjustable parameters. settings.py loads each process only once
# (scripts /utils/settings.py to provide a typology for each key.
#
# This document contains two sets of elements:
#   Reference Table for original consumption (hallucinated_scripts, remote_worker.hosts),
#      Structures can be relatively free.
#   2. Arguable parameters; no more background defaults are written in the code. Section/key is missing,
#      Settings._get reports errors directly. See below for more details under " Alignable Parameters".
#
# If you need to change the value directly from here, you need to change it from here; settings.py is read in @lru_cache.
# Long life cycle processes do not automatically detect changes and need to be restarted.


# ---------------------------------------------------------------------------
# A list of hallucinating script aliases. Looks/guard_bash will look at this table before actually implementing Bash:
# If Claude tries `python scripts/engine/<key>.py ...`, Hook will turn rejection down
# The message is reworded to "Do you want to run this?" for <value>.py, not a hint.
# General newspaper "unknown script".
#
# When a new script name, "Looks reasonable but actually wrong", appears in the log, an additional item is added here.
# Key is the wrong name that Claude made up; value is the real entry script
# (must exist under scripts/engine/).
# ---------------------------------------------------------------------------
hallucinated_scripts:
  eval.py: baseline.py
  run_eval.py: baseline.py
  verify.py: baseline.py
  check.py: quick_check.py
  run.py: baseline.py
  test.py: quick_check.py
  profile.py: baseline.py


# ---------------------------------------------------------------------------
# Remote worker SSH schedule;for:
#   `op-autoresearch worker --remote-host <alias> --start/stop/status ...`
#
# Each arias under `hosts:` describes an op-autoresearch that allows SSH to go in and start worker
# Daemon's machine. Every time --start / --status / --stop --remote-host is called, it's not the same thing.
# This table is read by op-autoresearch (default./config.yaml; available)
# --remote-config <path> overwrite.
#
# The fields state:
#   Repo_path (must be filled) absolute path of remote repository checkout. Op-autoresearch will move the remote
#                         PYTHONPATH fixed to `<repo_path>/src`,
#                         Make sure Damon runs the current checkout source, not
#                         The pip install version that remains in the site-packages.
#   env_script (must) start a shell script from before daemon. launcher will start first
#                         Enables conda shell hook, so SSH non-interactive shell
#                         You can also direct `conda activate ...`. The script must be completed
#                         Ensure that `python -c "import torch_npu, triton"` is available;
#                         The same python selected by PATH will run a remote op-autoresearch.
#   ssh_alias (optional) to host for ssh. Default equals the current key name; when
#                         ~ The host lias in the /.ssh/config and the name you want to use here
#                         Overwrite when inconsistent.
#
# Tunnels are automatically managed by op-autoresearch: --start opens
# `ssh -L <port>:127.0.0.1:<port> <alias> -f -N -T`, get forkk out.
# ssh pid writes ~/.op_autoresearch/tunnels/<port>.pid. Following --status / --stop /
# `--worker-url 127.0.0.1:<port>` will have transparent access to the remote damon via the tunnel.
# ---------------------------------------------------------------------------
  # Example configuration;filling by actual deployment path and environmental script:
  #   my-npu:
  #     repo_path: /abs/path/to/op-autoresearch
  #     env_script: /abs/path/env.sh
  #     # ssh_alias: my-host
remote_worker:
  hosts:
    npu:
      repo_path:
      env_script:
      ssh_alias:


# ===========================================================================
# Alignable parameters.
#
# All contents below are based on config.yaml as a single factual source. settings.py is exposed to each key
# A accessor (settings. <name>()) without the code default; section missing
# KeyError. Please change only the value here; not in
# Add a fallback to the settings.py or downstream caller, otherwise it would undermine the single source constraint.
# If you want to delete a parameter, you need to delete both accessor in settings.py and in this document
# Key and caller with an audit of `git grep <accessor>`.
# ===========================================================================


# ---------------------------------------------------------------------------
# task default; when scafed CLI flag is not imported and task.yaml does not have a fixed corresponding field
# Use. runtime priority:
#       task.yaml field > This defaults block > (uncoded default)
#
# The parsed value is written to task.yaml when the scaffold job is created. Therefore, even if later transferred here
# defaults, created task still retains the value from then scaffold.
#
# The fields state:
#   max_rounds(int) Optimized turn budget for new assignments: PLAN → EDIT →
#                                       eval loop. state machine meeting after reaching max_rounds
#                                       Automatically transfer to FINISH and write report.md.
#                                       scaffold's --max-rounds overwrites by task.
#   Eval_timeout (int seconds) wall clock budget for a single verify/profile subprocess.
#                                       eval_runner Zooms on num_cases; 50
#                                       Shape's op will get about 50 times the budget.
#                                       SIGKIL/124 High-time; trying to make hang fail faster
#                                       Turn it down.
#   When the task-level configuration is not provided by the reference_data_timeout (int seconds), the task-level configuration is not available.
#                                       General_Reference budget.
#   smoke_test_timeout (int seconds)quick_check optional smoke test budget
#                                       (on a task basis, not on a sape basis). Only
#                                       task.yaml triggers when setting smoke_test_script.
#                                       It should be smaller at each Edit key path.
#   Code_checker_enabled (bool)Triton impl AST regression check is default enabled.
#                                       This check was called by quick_check.py
#                                       scripts/utils/validate_triton_impl.py,
#                                       @triton.jitcontrac.
#                                       Available in task.yaml
#                                       `code_checker: {enabled: false}` or
#                                       scaffold's --no-code-checker closed by task.
#   Metric.primary(str) keep_or_discard read the indicator name. Currently only
#                                       `latency_us` will be explained; other values will enter
#                                       "unknown metric" branch of report.py.
#   Metric.lower_is_better (bool) true for smaller (latency); false for
#                                       The bigger the better.
#   (a) Metric.improvement_threshold (float)KEEP threshold. The unit is a percentage, not decimal;
#                                       with is_improvement
#                                       `relative_pct = (best-cand)/|best| * 100`
#                                       Alignment. Example:
#                                         0.0 → Keep
#                                         2.0 → needs to be raised by more than 2 %
#                                         5.0 → needs to increase by more than 5 %
#                                       Set here 0.05 for "> 0.05 %", almost anything.
#                                       It's all going through.
#   Consective_fail_threshold(int) continues FAIL several times from PLAN/EDIT
#                                       DIAGNOSE. Formerly in phase_policy.py
#                                       Hard-coded `3`.
#   Diagnose_max_attempts (int)
#                                       Maximum number of multiple tests; after that, enter the path of the artificial bottoming product.
#                                       Previously coded in state_store.py as
#                                       `DIAGNOSE_ATTEMPTS_CAP = 5`.
#   Back / framework / dsl(str) workspace target group, fixed by repo.
#                                       I'll send them to you.
#                                       op_autoresearch.op.verifier.KernelVerifier.
#                                       where `dsl` uses snake-form, e. g.
#                                       `triton_ascend`. This configuration does not belong to TaskConfig;
#                                       This is single repo single target design, consistent with skill_dsl.
#                                       Default value for eval_kernel.py aggparse for CA
#                                       is the upstream equivalent.
# ---------------------------------------------------------------------------
defaults:
  max_rounds: 30
  eval_timeout: 600
  reference_data_timeout: 120
  kill_grace_s: 5.0
  kill_drain_s: 2.0
  smoke_test_timeout: 10
  code_checker_enabled: true
  metric:
    primary: latency_us
    lower_is_better: true
    improvement_threshold: 0.0
  skill_dsl: ascendc
  backend: ascend
  framework: torch
  dsl: ascendc
  consecutive_fail_threshold: 3
  diagnose_max_attempts: 5


# ---------------------------------------------------------------------------
# eval time measurement configuration (utils/eval_runner.local_eval{,_async}).
# Read where the time actually occurs: the remote eval is the config.yaml on the side of WOrkER.
# Not the config.yaml on the edge of the orchestrator. You need to keep both sides synchronized; otherwise you have to accept
# Local-baseline and remote round's warmup/repeats may be different.
#
# The fields state:
#   Warmup (int) measures the number of preheats that do not count before starting. The greater the value, JIT/cache
#                  The warmer the warmer, the longer the clocks of each wall. For most of the ops, the more the warmer the heat is, the longer the clocks go.
#                  Ten times is enough to stabilize the triton-ascend compilation cache.
#   repeats (int) is the number of official time series, the average of which is the latency_us of each share.
#                  The larger the value, the lower the difference, the longer each wall clock. On 910B, it was observed
#                  100 is the appropriate point between the difference and the cost.
# ---------------------------------------------------------------------------
eval:
  warmup: 5
  repeats: 50


# ---------------------------------------------------------------------------
# Remote worker daemon configuration. Cables share the same source:
#   - op-autoresearch (on the side of the developer): Tunnel Port, Ready Wait, Status Search
#   -op_autoresearch.worker.server: bind port (avoiding drift on both sides)
#
# Ready_* / status_* timeout overp-autoresearch by remote daemon via `ssh -L`
# scene; apart from daemon's own startup time, there will be an unstable network going to and from latency. If the network is slow
# "worker not ready" miscalculation is raised; if you want the card to die daemon to fail more quickly, you can't be sure of it.
# Just turn it down.
#
# The fields state:
#   port(int)worker bound TCP port ( 127.0.0.1; to developer only)
#                               . Also op-autoresearch --start/
#                               --status / --stop default --port. After this change,
#                               Next `op-autoresearch worker --start` will automatically use the new port.
#   Ready_timeout (float) waits for a response from the op-autoresearch after starting the daemon
#                               /status 's seconds. Every ready_poll_interval 's seconds rotates.
#                               Cann effect + worker starts at warm size about 5s,
#                               Cold Cache is about 15s; 20s leaves a surplus.
#   Ready_poll_interval (float) starts the second of two seconds in the waiting cycle.
#                               The smaller you find, the faster you're ready, the more SSH noise you're waiting for.
#   Ready_probe_timeout (float) timeout in single /status poll cycle.
#                               Keep it short, avoid the tunnel jamming at once, and eat the whole thing.
#                               Ready_timeout. Different from the next status_timeout.
#   Number of seconds for status_timeout (float) stand alone /status capable of sexual detection
#                               (`op-autoresearch worker --status` uses this path;
#                               Eval_client also used it to quickly fail before sending multipart/run.
#                               High latency links can be scaled up.
#   free_ttl (float) idle distance
#                               recaper recovery.
#   Please_read_interval (float) daemon scans the number of seconds between expired lines.
#   acquire_timeout (float) server waiting for free time;
#                               Overtime /acquire_device returns 503.
#   http_read_margin (float)clit read-timeout relative service work/wait budget
#                               Additional excess left.
#   /release_device clint read-timeout.
#   Doc_timeout (float)/docs/<name> clit read-timeout.
#   Health_timeout (float) daemon side/health event-loop maximum.
# ---------------------------------------------------------------------------
worker:
  port: 9111
  ready_timeout: 20.0
  ready_poll_interval: 0.5
  ready_probe_timeout: 1.5
  status_timeout: 5.0
  lease_ttl: 120.0
  lease_reap_interval: 30.0
  acquire_timeout: 600.0
  http_read_margin: 10.0
  release_timeout: 10.0
  doc_timeout: 20.0
  health_timeout: 5.0


# ---------------------------------------------------------------------------
# Batch driver parameters (scripts/batch/*). Here are two unrelated types of timeout:
# Tier 1/2 pre-screening for pre-runs (batch/ verify.py usage), and for each op
# driver wall clock upper limit and cooling time between op (used when batt/ run.py cycle op).
#
# The fields state:
#   Tier1_timeout (int seconds) per op Tier 1 budget:import +
#                                   Tiny-shape smoke. NPU is not needed, primary grammatical error
#                                   AND LOST EXPORT.
#   Tier2_timeout (int seconds) for each op Tier 2 budget: use real
#                                   Kernel does complete multi-shape correctness verification.
#                                   Tranton-ascend under the cold JIT, about 50 bucks.
#                                   It's very special for constexpr, Kernel.
#                                   (maxpool3d, variation, etc.) It may take a few minutes.
#   Run_timeout_min (int minutes)watch/run.py per hardwall clock limit for each op
#                                   (note minutes, not seconds). Each op runs at most
#                                   so long; run.py will SIGTERM
#                                   claude --print and mark the op as `error`.
#                                   Use `batch/run.py --timeout-min N` to overwrite one time.
#                                   Suggested calibration of about 3 times the median number of observations
#                                   (cut JIT + 30 wheel + report).
#   The clockdown_sec (int seconds) catch/ run.py between two ops.
#                                   Let worker complete cleanup (release, GC HBM)
#                                   , and then let the next op acquire. Available
#                                   `--cooldown-sec N` overwrite. 0 allows, but is easier to trigger
#                                   Occasional device-acquire competition.
#   Transient_retries(int) is the same op inside when session crashes
#                                   (claude.exe rc != 0)butframeworkProgress is still complete.
#                                   (progress_initialized=True), watch/run.py
#                                   Restart at most.
#                                   `claude --print /autoresearch --resume
#                                   The number of times <task_dir> --force` is used to block.
#                                   ECONNRESET / stread adle timeout / temporary API
#                                   Errors such as not going stop_save exiting the CLI case.
#                                   If you fail, you won't try again. You'll be exposed:
#                                   rc = 0 + case! = FINISH means LLM ends early
#                                   rc! = 0 + no project means baseline has not yet been submitted.
# ---------------------------------------------------------------------------
batch:
  tier1_timeout: 30
  tier2_timeout: 600
  run_timeout_min: 180
  cooldown_sec: 5
  transient_retries: 3


# ---------------------------------------------------------------------------
# Batch reporter (summarize.py / monitor.py) and shared in settings.py
# The value is speedup fraction:
# v = baseline_us / candidate_us; v = 1.0 means candidate is equal to ref.
#
# Three barrels: v > improved_above → "improved"; v < review_below → "regress";
# → "on-par" in the middle. The wider the area, the more open the noise; the narrower the zone, the smaller the changes will be marked.
#
# The fields state:
#   Speedup_improved_above (float) upper barrel threshold.v Above the value Times "improved".
#   Speedup_regress_below (float) threshold below the current value "regress".
# ---------------------------------------------------------------------------
metrics:
  speedup_improved_above: 1.05
  speedup_regress_below: 0.95


# ---------------------------------------------------------------------------
# Resume Cardiac Freshness Window (scripts/resume.py).
#
# /autoresearch is updated every time you call
# `last_touched` field of <task_dir> /.ar_state/state.json. If a task
# Last_touched updated than this window considers it still held by another live session;
# Resume will reject attach, avoid competition with the session that is being written. If some slow EDIT turns
# It's probably more than this time, making it bigger; if you want to restore to the kill session more quickly, turn it down.
#
# The fields state:
#   Heartbeat_fresh_seconds (int seconds) above.
# ---------------------------------------------------------------------------
resume:
  heartbeat_fresh_seconds: 180
